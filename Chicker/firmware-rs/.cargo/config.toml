[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# `cargo run --release` converts the ELF to UF2 and copies it to a mounted
# RPI-RP2 BOOTSEL drive (hold BOOT, tap RESET, then run).
runner = "elf2uf2-rs -d"
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
]

[build]
target = "thumbv6m-none-eabi"

[env]
EMBASSY_EXECUTOR_TASK_ARENA_SIZE = "16384"
