[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# `cargo run --release` flashes a board already in BOOTSEL mode via the
# PICOBOOT USB protocol (no mounted drive needed). Prefer ./flash.sh, which
# also reboots running firmware into BOOTSEL first (console `bootloader`).
runner = "picotool load -u -v -x -t elf"
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
    # embassy-rp's fragment that pins the .boot2 blob to 0x10000000 — without
    # it the ROM finds no valid second-stage bootloader and the chip falls
    # back into BOOTSEL instead of booting the firmware.
    "-C", "link-arg=-Tlink-rp.x",
]

[build]
target = "thumbv6m-none-eabi"

[env]
EMBASSY_EXECUTOR_TASK_ARENA_SIZE = "16384"
